<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Links</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 40px 20px;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: url('https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExdWIxNWpyMTRzbG1xaGM4dDlvNHRsYWU4Z2Rjb20xdzE0YW84MWxudyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/dU97uV3UyP0ly/giphy.gif');
    background-size: cover;
    background-position: center;
    filter: brightness(0.5);
    z-index: -1;
  }

  .profile {
    text-align: center;
    margin-bottom: 30px;
  }

  .avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin: 0 auto 15px;
    border: 3px solid rgba(255,255,255,0.6);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  h1 {
    color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    margin: 0 0 6px;
    font-size: 2rem;
    letter-spacing: 1px;
  }

  .subtitle {
    color: rgba(255,255,255,0.8);
    font-size: 14px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.8);
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 320px;
  }

  a.link-btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 14px 20px;
    text-decoration: none;
    color: #fff;
    border-radius: 14px;
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 4px 15px rgba(0,0,0,0.35);
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  a.link-btn::before {
    content: "";
    position: absolute;
    top: 0; left: -75%;
    width: 50%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: skewX(-20deg);
    transition: left 0.6s ease;
  }

  a.link-btn:hover::before { left: 130%; }

  a.link-btn:hover {
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
  }

  a.link-btn:active {
    transform: translateY(-1px) scale(0.98);
  }

  .icon {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
  }

  .text-wrap {
    display: flex;
    flex-direction: column;
    line-height: 1.25;
  }

  .link-title {
    font-weight: 700;
    font-size: 15px;
  }

  .link-desc {
    font-size: 12px;
    color: rgba(255,255,255,0.75);
  }

  .facebook { background: linear-gradient(135deg, #1877f2, #0d5cd6); }
  .tiktok   { background: linear-gradient(135deg, #010101, #2b2b2b); border-color: #fff; }
  .discord  { background: linear-gradient(135deg, #5865f2, #404eed); }
  .custom   { background: linear-gradient(135deg, #ff416c, #ff4b2b); }

</style>
